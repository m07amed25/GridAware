name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  FORCE_COLOR: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  client:
    name: Client (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install client workspace dependencies
        run: pnpm install --filter client... --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: client/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('client/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Lint
        run: pnpm --filter client lint

      - name: Typecheck
        run: pnpm --filter client typecheck

      - name: Unit tests
        run: pnpm --filter client test

      - name: Build production bundle
        env:
          NODE_ENV: production
          API_INTERNAL_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: /api/v1
        run: pnpm --filter client build

  server:
    name: Server & Contracts (NestJS + Prisma)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridaware_test?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/gridaware_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      MQTT_URL: mqtt://localhost:1883
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install server workspace dependencies
        run: pnpm install --filter server... --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter server prisma:validate

      - name: Generate Prisma client
        run: pnpm --filter server prisma:generate

      - name: Validate OpenAPI, AsyncAPI & JSON Schema contracts
        run: pnpm --filter server contracts:validate

      - name: Lint (oxlint type-aware)
        run: pnpm --filter server lint

      - name: Typecheck
        run: pnpm --filter server typecheck

      - name: Unit tests & coverage
        run: pnpm --filter server test:cov

      - name: End-to-end HTTP tests
        run: pnpm --filter server test:e2e

      - name: Build production bundle
        run: pnpm --filter server build

  docker:
    name: Docker & Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configurations
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build client production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: client/Dockerfile
          target: runner
          load: true
          tags: gridaware/client:local
          build-args: |
            API_INTERNAL_URL=http://server:3001
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha,scope=client
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,scope=client,mode=max' || '' }}

      - name: Build server production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          target: runner
          load: true
          tags: gridaware/server:local
          cache-from: type=gha,scope=server
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,scope=server,mode=max' || '' }}

      - name: Boot Compose stack and verify healthchecks & proxy
        run: |
          cat > server/.env <<'EOF'
          NODE_ENV=production
          DATABASE_URL=postgresql://user:pass@ep-ci-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
          AUTH_ACCESS_TOKEN_SECRET=ci-smoke-test-access-token-secret-32chars
          MAIL_PROVIDER=resend
          MAIL_API_KEY=ci_dummy_mail_api_key
          MQTT_ALLOW_ANONYMOUS=true
          EOF

          docker compose up -d --no-build --wait --wait-timeout 90

          curl -fsS http://127.0.0.1:3001/api/v1/health/live | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q '"service":"gridaware-server"'

          cat >> server/.env <<'EOF'
          MQTT_USERNAME=ci_device
          MQTT_PASSWORD=ci_secret_password
          MQTT_ALLOW_ANONYMOUS=false
          EOF
          docker compose up -d --no-build --force-recreate mosquitto server --wait --wait-timeout 45
          timeout 30s bash -c 'until docker compose logs --no-color server | grep -q "Connected to MQTT broker"; do sleep 1; done'
          timeout 5s docker compose exec -T mosquitto sh -c 'mosquitto_sub -h localhost -u "$MQTT_USERNAME" -P "$MQTT_PASSWORD" -t '\''$SYS/broker/uptime'\'' -C 1 -W 3'
          if timeout 5s docker compose exec -T mosquitto mosquitto_sub -h localhost -t '$SYS/broker/uptime' -C 1 -W 1 >/dev/null 2>&1; then
            echo "Mosquitto accepted an anonymous connection with credentials configured" >&2
            exit 1
          fi

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true

      - name: Tear down Compose stack
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          rm -f server/.env

  ci-gate:
    name: CI Gate
    if: always()
    needs: [client, server, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all CI jobs succeeded
        env:
          CLIENT_RESULT: ${{ needs.client.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          echo "client=${CLIENT_RESULT}, server=${SERVER_RESULT}, docker=${DOCKER_RESULT}"
          if [ "${CLIENT_RESULT}" != "success" ] || [ "${SERVER_RESULT}" != "success" ] || [ "${DOCKER_RESULT}" != "success" ]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
