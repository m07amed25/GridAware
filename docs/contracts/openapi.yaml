openapi: 3.1.0
info:
  title: GridAware Public API
  version: 1.0.0-draft
  description: >-
    Draft public REST contract for the GridAware simulator-first B2B SaaS MVP.
    See docs/architecture/phase-3.3/rest-api-endpoint-catalog.md for the broader route catalog.
servers:
  - url: https://api.gridaware.example/api/v1
    description: Placeholder production origin; replace during deployment design.
  - url: http://localhost:4000/api/v1
    description: Local development
security:
  - accessCookieAuth: []
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Identity
  - name: Organizations
  - name: Sites
  - name: Assets
  - name: Telemetry
  - name: Incidents
  - name: Work Orders
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness probe
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness probe
      responses:
        '200': { description: Required dependencies are ready }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: Issue or refresh CSRF double-submit cookie and token
      responses:
        '200':
          description: CSRF token issued and ga_csrf cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a new global user account in PENDING_VERIFICATION status
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeaderOptionalBootstrap'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User registered; verification email queued/dispatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate an ACTIVE user and issue HttpOnly session cookies
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeaderOptionalBootstrap'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated; sets ga_access, ga_refresh, and ga_csrf cookies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      security:
        - refreshCookieAuth: []
      summary: Atomically rotate refresh token and issue a new access token cookie
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Session rotated; new ga_access, ga_refresh, and ga_csrf cookies set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRefreshResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke current session (if present) and clear auth cookies
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Current session revoked and cookies cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAckResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout-all:
    post:
      tags: [Auth]
      security:
        - accessCookieAuth: []
      summary: Revoke all active sessions for the current user and clear cookies
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: All active sessions for user revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutAllResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/me:
    get:
      tags: [Auth, Identity]
      security:
        - accessCookieAuth: []
      summary: Return current authenticated user's safe profile
      responses:
        '200':
          description: Safe user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/sessions:
    get:
      tags: [Auth]
      security:
        - accessCookieAuth: []
      summary: List active sessions owned by the current authenticated user
      responses:
        '200':
          description: Active sessions ordered by most recently used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      security:
        - accessCookieAuth: []
      summary: Revoke a single active session owned by the current user
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Owned session revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAckResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/email-verification/resend:
    post:
      tags: [Auth]
      security: []
      summary: Request a new email-verification message (non-enumerating)
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeaderOptionalBootstrap'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnlyRequest' }
      responses:
        '202':
          description: Generic non-enumerating acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Confirm email ownership with a single-use verification token
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeaderOptionalBootstrap'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenConfirmRequest' }
      responses:
        '200':
          description: Email verified and user status transitioned to ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/password-reset/request:
    post:
      tags: [Auth]
      security: []
      summary: Request a password-reset message (non-enumerating)
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeaderOptionalBootstrap'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnlyRequest' }
      responses:
        '202':
          description: Generic non-enumerating acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Set a new passphrase with a single-use reset token and revoke all existing user sessions
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeaderOptionalBootstrap'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordConfirmRequest' }
      responses:
        '200':
          description: Passphrase updated and all prior sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me:
    get:
      tags: [Identity]
      security:
        - accessCookieAuth: []
      summary: Return current user and organization memberships
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations where caller has active membership
      responses:
        '200':
          description: Organization list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationListResponse' }
    post:
      tags: [Organizations]
      summary: Create organization and initial OWNER membership
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/access-context:
    get:
      tags: [Organizations]
      summary: Retrieve current authenticated user role and effective permissions in the organization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Verified organization authorization context and permission list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organizations/{organizationId}/members:
    get:
      tags: [Organizations]
      summary: List paginated organization members (requires members:read)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated organization member list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organizations/{organizationId}/members/{membershipId}:
    get:
      tags: [Organizations]
      summary: Get tenant-scoped member detail (requires members:read)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Organizations]
      summary: Soft-remove an eligible membership (requires members:remove; last-owner protected)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Membership removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/members/{membershipId}/role:
    patch:
      tags: [Organizations]
      summary: Update a non-owner member role (requires members:update-role)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRoleRequest' }
      responses:
        '200':
          description: Member role updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/members/{membershipId}/suspend:
    post:
      tags: [Organizations]
      summary: Suspend an active membership (requires members:suspend; last-owner protected)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Membership suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/members/{membershipId}/reactivate:
    post:
      tags: [Organizations]
      summary: Reactivate a suspended membership (requires members:suspend)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Membership reactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/ownership-transfer:
    post:
      tags: [Organizations]
      summary: Atomically transfer organization ownership to an active member (OWNER only)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnershipRequest' }
      responses:
        '200':
          description: Ownership transferred atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipTransferResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/sites:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Sites]
      summary: List sites within an authorized organization
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Site list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sites]
      summary: Create site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteRequest' }
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteResponse' }
  /sites/{siteId}/assets:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Assets]
      summary: List assets at a site
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
    post:
      tags: [Assets]
      summary: Register asset under a site
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
      responses:
        '201':
          description: Asset registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /assets/{assetId}/telemetry:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Telemetry]
      summary: Query asset telemetry within a bounded time range
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: metric
          in: query
          schema: { type: string }
        - name: interval
          in: query
          schema: { type: string, enum: [raw, 1m, 5m, 15m, 1h] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Telemetry readings or downsampled time series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /organizations/{organizationId}/incidents:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Incidents]
      summary: List incidents in an authorized organization
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentListResponse' }
    post:
      tags: [Incidents]
      summary: Create a manually reported incident
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncidentRequest' }
      responses:
        '201':
          description: Incident created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentResponse' }
  /incidents/{incidentId}/assign:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    post:
      tags: [Incidents]
      summary: Assign incident to an active organization member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assigneeUserId]
              properties:
                assigneeUserId: { type: string, format: uuid }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Assignment updated }
        '409': { $ref: '#/components/responses/Conflict' }
  /work-orders/{workOrderId}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    post:
      tags: [Work Orders]
      summary: Complete assigned work order with findings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [completionSummary]
              properties:
                completionSummary: { type: string, minLength: 5, maxLength: 5000 }
                findings:
                  type: array
                  maxItems: 50
                  items: { type: string, maxLength: 500 }
                completedAt: { type: string, format: date-time }
      responses:
        '200': { description: Work order completed }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    accessCookieAuth:
      type: apiKey
      in: cookie
      name: ga_access
      description: Short-lived (15m) HttpOnly signed JWT access cookie
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: ga_refresh
      description: Rotating HttpOnly opaque session credential (<sessionId>.<secret>)
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token matching ga_csrf cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional Bearer JWT access token
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must match the ga_csrf double-submit cookie value
      schema: { type: string, minLength: 32, maxLength: 128 }
    CsrfTokenHeaderOptionalBootstrap:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required whenever auth/csrf cookies are sent; Origin allowlist is enforced on browser POSTs
      schema: { type: string, minLength: 32, maxLength: 128 }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        servedAt: { type: string, format: date-time }
        pagination:
          type: object
          properties:
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
            limit: { type: integer }
    Problem:
      type: object
      required: [title, status, code, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    UserStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DEACTIVATED]
    SafeUserProfile:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        status: { $ref: '#/components/schemas/UserStatus' }
        emailVerified: { type: boolean }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 120 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    EmailOnlyRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    TokenConfirmRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
    ResetPasswordConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, userAgent, createdAt, lastUsedAt, idleExpiresAt, absoluteExpiresAt, isCurrent]
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
    CsrfTokenResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [csrfToken]
          properties:
            csrfToken: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    RegisterResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user, verificationRequired]
          properties:
            user: { $ref: '#/components/schemas/SafeUserProfile' }
            verificationRequired: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }
    AuthUserResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/SafeUserProfile' }
        meta: { $ref: '#/components/schemas/Meta' }
    SessionRefreshResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [sessionId, idleExpiresAt, absoluteExpiresAt]
          properties:
            sessionId: { type: string, format: uuid }
            idleExpiresAt: { type: string, format: date-time }
            absoluteExpiresAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
    SessionListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ActionAckResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [success]
          properties:
            success: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }
    LogoutAllResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [revokedCount]
          properties:
            revokedCount: { type: integer, minimum: 0 }
        meta: { $ref: '#/components/schemas/Meta' }
    GenericMessageResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [accepted, message]
          properties:
            accepted: { type: boolean }
            message: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    MeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [id, email, displayName, status, emailVerified, memberships]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            displayName: { type: string }
            status: { $ref: '#/components/schemas/UserStatus' }
            emailVerified: { type: boolean }
            memberships: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/Meta' }
    Organization:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        timezone: { type: string, example: Africa/Cairo }
    OrganizationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Organization' }
        meta: { $ref: '#/components/schemas/Meta' }
    OrganizationListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Site:
      type: object
      required: [id, code, name, timezone, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timezone: { type: string }
        status: { type: string }
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [code, name, timezone]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 160 }
        timezone: { type: string, example: Africa/Cairo }
        address: { type: [string, 'null'], maxLength: 500 }
    SiteResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Site' }
        meta: { $ref: '#/components/schemas/Meta' }
    SiteListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Site' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Asset:
      type: object
      required: [id, code, name, assetTypeCode, criticality, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        assetTypeCode: { type: string }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string }
    CreateAssetRequest:
      type: object
      additionalProperties: false
      required: [code, name, assetTypeCode, criticality]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 160 }
        assetTypeCode: { type: string }
        buildingId: { type: [string, 'null'], format: uuid }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        manufacturer: { type: [string, 'null'], maxLength: 120 }
        model: { type: [string, 'null'], maxLength: 120 }
    AssetResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Asset' }
        meta: { $ref: '#/components/schemas/Meta' }
    AssetListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        meta: { $ref: '#/components/schemas/Meta' }
    TelemetryPoint:
      type: object
      required: [sensorId, metricCode, value, unit, observedAt, quality, source]
      properties:
        sensorId: { type: string, format: uuid }
        metricCode: { type: string }
        value: { type: number }
        unit: { type: string }
        observedAt: { type: string, format: date-time }
        quality: { type: string, enum: [VALID, SUSPECT, INVALID] }
        source: { type: string, enum: [SIMULATOR, DEVICE, IMPORT] }
    TelemetryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TelemetryPoint' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Incident:
      type: object
      required: [id, title, severity, status, assetId]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        severity: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [DETECTED, TRIAGED, ASSIGNED, INVESTIGATING, RESOLVED, CLOSED] }
        assetId: { type: string, format: uuid }
    CreateIncidentRequest:
      type: object
      additionalProperties: false
      required: [siteId, assetId, title, description, severity]
      properties:
        siteId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        title: { type: string, minLength: 3, maxLength: 160 }
        description: { type: string, minLength: 5, maxLength: 5000 }
        severity: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
    IncidentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Incident' }
        meta: { $ref: '#/components/schemas/Meta' }
    IncidentListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        meta: { $ref: '#/components/schemas/Meta' }
    RbacMembershipRole:
      type: string
      enum: [OWNER, FACILITY_MANAGER, ENGINEER, TECHNICIAN, VIEWER]
    AssignableNonOwnerRole:
      type: string
      enum: [FACILITY_MANAGER, ENGINEER, TECHNICIAN, VIEWER]
    RbacMembershipStatus:
      type: string
      enum: [INVITED, ACTIVE, SUSPENDED, REMOVED]
    AccessContextData:
      type: object
      additionalProperties: false
      required: [organizationId, membershipId, role, permissions, policyVersion]
      properties:
        organizationId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/RbacMembershipRole' }
        permissions:
          type: array
          items: { type: string }
        policyVersion: { type: string }
    AccessContextResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AccessContextData' }
        meta: { $ref: '#/components/schemas/Meta' }
    MemberSummary:
      type: object
      additionalProperties: false
      required:
        - membershipId
        - organizationId
        - userId
        - email
        - displayName
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        membershipId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/RbacMembershipRole' }
        status: { $ref: '#/components/schemas/RbacMembershipStatus' }
        suspendedAt: { type: [string, 'null'], format: date-time }
        removedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemberDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MemberSummary' }
        meta: { $ref: '#/components/schemas/Meta' }
    MemberListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MemberSummary' } }
        meta: { $ref: '#/components/schemas/Meta' }
    UpdateMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/AssignableNonOwnerRole' }
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [targetMembershipId, confirmTransfer]
      properties:
        targetMembershipId: { type: string, format: uuid }
        confirmTransfer: { type: boolean, const: true }
        previousOwnerNextRole: { $ref: '#/components/schemas/AssignableNonOwnerRole' }
    OwnershipTransferData:
      type: object
      additionalProperties: false
      required: [organizationId, newOwnerMembership, previousOwnerMembership]
      properties:
        organizationId: { type: string, format: uuid }
        newOwnerMembership: { $ref: '#/components/schemas/MemberSummary' }
        previousOwnerMembership: { $ref: '#/components/schemas/MemberSummary' }
    OwnershipTransferResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/OwnershipTransferData' }
        meta: { $ref: '#/components/schemas/Meta' }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Sliding-window rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the caller may retry
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Required dependency not ready
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
