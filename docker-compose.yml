# GridAware local stack: web (Next.js), api (NestJS), Redis, Mosquitto.
# PostgreSQL is managed by Neon outside Docker (see server/.env).
#
#   docker compose up -d --build                                          # production images
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml watch  # dev with live sync

name: gridaware

services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: runner
      args:
        API_INTERNAL_URL: http://server:3001
        NEXT_PUBLIC_API_URL: /api/v1
    image: gridaware/client:local
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://server:3001
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runner
    image: gridaware/server:local
    ports:
      - "${SERVER_PORT:-3001}:3001"
    env_file:
      - path: server/.env
        required: false
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  mosquitto-data:
