# GridAware Mosquitto configuration
# Reference: docs/contracts/asyncapi.yaml
#
# Authentication is configured at container startup by docker/mosquitto/entrypoint.sh:
# - When MQTT_USERNAME and MQTT_PASSWORD are set (e.g. in server/.env), the entrypoint
#   generates a password file and enables `allow_anonymous false`.
# - When both are unset, it falls back to `allow_anonymous true` for local development.
# Before any shared/staging/production deployment, also configure per-device ACLs:
#   acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# MQTT TCP listener (device/simulator telemetry)
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets listener (browser/debug tooling)
listener 9001 0.0.0.0
protocol websockets
