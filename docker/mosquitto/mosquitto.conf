# GridAware local development Mosquitto configuration
# Reference: docs/contracts/asyncapi.yaml
#
# For local development, anonymous access is enabled on the local Docker network.
# Before any shared/staging/production deployment, disable anonymous access and
# configure per-device credentials and topic ACLs:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#   acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# MQTT TCP listener (device/simulator telemetry)
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets listener (browser/debug tooling)
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
